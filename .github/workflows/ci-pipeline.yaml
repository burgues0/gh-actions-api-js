name: ci-pipeline

on:
  push:
    branches:
      - release/go

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-go:
    uses: ./.github/workflows/ci-go.yaml
    with:
      workdir: ./api-go

  ci-code-scan:
    uses: ./.github/workflows/ci-code-scan.yaml
    needs: ci-go
    with:
      workdir: ./api-go
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-docker:
    uses: ./.github/workflows/ci-docker-publish.yaml
    needs: ci-code-scan
    with:
      workdir: .
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  cd-render-stage:
    uses: ./.github/workflows/cd-render-stage.yaml
    needs: ci-docker
    with:
      service_url: "https://gh-actions-api-js.onrender.com"
    secrets:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

  cd-render-prd:
    uses: ./.github/workflows/cd-render-prd.yaml
    needs: cd-render-stage
    with:
      service_url: "https://gh-actions-api-js.onrender.com"
    secrets:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
