name: ci-pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-js:
    uses: ./.github/workflows/ci-js.yaml
    with:
      workdir: ./api-js

  ci-code-scan:
    uses: ./.github/workflows/ci-code-scan.yaml
    needs: ci-js
    with:
      workdir: ./api-js
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-docker:
    uses: ./.github/workflows/ci-docker-publish.yaml
    needs: ci-code-scan
    with:
      workdir: .
