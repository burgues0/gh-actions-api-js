name: ci-pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-js:
    runs-on: ubuntu-latest
    steps:
      - name: Call JS Build Workflow
        uses: ./github/workflow/ci-js.yaml
        with:
          workdir: ./api-js

      - name: Call JS Code Scan Workflow
        uses: ./github/workflow/ci-code-scan.yaml

  ci-docker:
    runs-on: ubuntu-latest
    needs: ci-js
    steps:
      - name: Call JS Docker Publish Workflow
        uses: ./github/workflow/ci-docker-publish.yaml
