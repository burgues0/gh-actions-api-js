name: ci-docker-publish

on:
  workflow_call:
    inputs:
      workdir:
        required: true
        type: string
        description: "project working directory"
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  docker-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.workdir }}
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: dockerfile lint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

  docker-build-publish:
    runs-on: ubuntu-latest
    needs: docker-lint
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: docker buildx
        uses: docker/setup-buildx-action@v4

      - name: docker build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags:
            - ${{ secrets.DOCKERHUB_USERNAME }}/dockerhub-images:latest
            - ${{ secrets.DOCKERHUB_USERNAME }}/dockerhub-images:${{ github.sha }}

      - name: run trivy vuln scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/dockerhub-images:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
